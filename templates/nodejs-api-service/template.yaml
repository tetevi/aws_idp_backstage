apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: node-api-service
  title: New Node.js API Service
  description: >
    Scaffolds a minimal Node.js API service, creates a GitHub repository
    under tetevi, pushes the starter code, and registers the service in the
    Backstage catalog.
  tags:
    - recommended
    - nodejs
    - aws
spec:
  owner: user:default/tetevi
  type: service

  parameters:
    - title: Service details
      required:
        - name
        - owner
      properties:
        name:
          title: Service name
          type: string
          description: Unique name. Used for the repo name and the catalog entity.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
          ui:help: Lowercase letters, numbers and dashes only. Example, orders-api
        description:
          title: Description
          type: string
          description: What does this service do?
          default: A Node.js API service scaffolded by the IDP portal.
        owner:
          title: Owner
          type: string
          description: Owner of the component in the catalog.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User

  steps:
    - id: fetch
      name: Fetch starter skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Create and push GitHub repo
      action: publish:github
      input:
        repoUrl: github.com?owner=tetevi&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
        protectDefaultBranch: false

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
