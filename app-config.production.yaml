app:
  baseUrl: ${APP_BASE_URL}

backend:
  baseUrl: ${APP_BASE_URL}
  # ':7007' binds all interfaces, which the container needs so the published
  # port is reachable. Do not change this to localhost.
  listen: ':7007'
  csp:
    upgrade-insecure-requests: false
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

integrations:
  github:
    - host: github.com
      token: ${AUTH_GITHUB_TOKEN}

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

catalog:
  locations:
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
    - type: url
      target: https://github.com/tetevi/aws_idp_backstage/blob/main/templates/nodejs-api-service/template.yaml
      rules:
        - allow: [Template]
    - type: url
      target: https://github.com/tetevi/new-idp-service/blob/main/catalog-info.yaml